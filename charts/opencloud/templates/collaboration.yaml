{{- include "bjw-s.common.loader.init" . }}

{{- define "collaboration.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.collaboration.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}

{{ if .Values.opencloud.global.nameOverride }}
persistence:
  config:
    existingClaim: "{{ .Release.Name }}-{{ .Values.opencloud.global.nameOverride }}-config"
{{ end }}
{{ if or .Values.opencloud.global.nameOverride .Values.collabora.global.nameOverride }}
controllers:
  main:
    {{ if .Values.opencloud.global.nameOverride }}
    containers:
      main:
        env:
          MICRO_REGISTRY_ADDRESS: "{{ .Release.Name }}-{{ .Values.opencloud.global.nameOverride }}:9233"
    {{ end }}
    initContainers:
      {{ if .Values.opencloud.global.nameOverride }}
      wait-for-opencloud:
        command:
          - "sh"
          - "-c"
          - "until wget -q -O- http://{{ .Release.Name }}-{{ .Values.opencloud.global.nameOverride }}:9200/health; do echo waiting for opencloud; sleep 5; done;"
      {{ end }}
      {{ if .Values.collabora.global.nameOverride }}
      wait-for-collabora:
        command:
          - "sh"
          - "-c"
          - "until wget -q -O- http://{{ .Release.Name }}-{{ .Values.collabora.global.nameOverride }}:9980/hosting/discovery; do echo waiting for collabora; sleep 2; done;"
      {{ end }}
{{ end }}
{{- end -}}

{{- $ctx := deepCopy . -}}
{{- $_ := get .Values "collaboration" | mergeOverwrite $ctx.Values -}}
{{- $_ = mergeOverwrite $ctx.Values (include "collaboration.hardcodedValues" . | fromYaml) -}}

{{/* Render the templates */}}
{{ if .Values.collabora.enabled }}
{{ include "bjw-s.common.loader.generate" $ctx }}
{{ end }}

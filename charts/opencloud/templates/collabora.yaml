{{- include "bjw-s.common.loader.init" . }}

{{- define "collabora.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.collabora.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}

{{ if or .Values.collabora.global.nameOverride .Values.collaboration.global.nameOverride }}
controllers:
  main:
    containers:
      main:
        env:
          {{ if .Values.collaboration.global.nameOverride }}
          aliasgroup1: "http://{{ .Release.Name }}-{{ .Values.collaboration.global.nameOverride }}:9300,https://{{ .Values.config.domain.wopiServer }}"
          {{ end }}
          {{ if .Values.collabora.global.nameOverride }}
          username:
            valueFrom:
              secretKeyRef:
                name: "{{ .Release.Name }}-{{ .Values.collabora.global.nameOverride }}"
          password:
            valueFrom:
              secretKeyRef:
                name: "{{ .Release.Name }}-{{ .Values.collabora.global.nameOverride }}"
          {{ end }}
{{ end }}
{{- end -}}

{{- $ctx := deepCopy . -}}
{{- $_ := get .Values "collabora" | mergeOverwrite $ctx.Values -}}
{{- $_ = mergeOverwrite $ctx.Values (include "collabora.hardcodedValues" . | fromYaml) -}}

{{/* Render the templates */}}
{{ if .Values.collabora.enabled }}
{{ include "bjw-s.common.loader.generate" $ctx }}
{{ end }}
